function evs(){return events.filter(e=>tag==='全部'||e.tag===tag)}function calendar(){mini();$('#caltitle').textContent=`${mn(cursor)} ${cursor.getFullYear()}`;let root=$('#calendar');if(view==='month'){let y=cursor.getFullYear(),m=cursor.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();$('#range').textContent=`${y} 年 ${m+1} 月`;let h=['一','二','三','四','五','六','日'].map(x=>`<div class="calhead">${x}</div>`).join('');let rows=Math.ceil((off+n)/7);for(let i=0;i<rows*7;i++){let num=i-off+1,valid=num>0&&num<=n,d=new Date(y,m,num),date=fd(d),list=valid?evs().filter(e=>e.date===date):[];h+=`<div class="day ${valid&&date===fd(today)?'is-today':''}"><div class="num ${!valid?'other':date===fd(today)?'today':''}">${valid?num:''}</div>${list.slice(0,3).map(e=>`<div class="event ${e.color}" data-event="${e.id}"><b>${e.time}</b>${e.title}</div>`).join('')}${list.length>3?`<small>+${list.length-3} 更多</small>`:''}</div>`}root.innerHTML=`<div class="calgrid">${h}</div>`}else if(view==='week'){let mon=new Date(cursor);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));let days=Array.from({length:7},(_,i)=>{let d=new Date(mon);d.setDate(d.getDate()+i);return d});$('#range').textContent=`${days[0].getMonth()+1}/${days[0].getDate()} – ${days[6].getMonth()+1}/${days[6].getDate()}`;let h=`<div class="weekgrid"><div class="weekhead"></div>${days.map(d=>`<div class="weekhead ${fd(d)===fd(today)?'is-today':''}">${'日一二三四五六'[d.getDay()]}<b>${d.getDate()} ${fd(d)===fd(today)?'<span class="today-indicator">今天</span>':''}</b></div>`).join('')}`;for(let hr=8;hr<=18;hr++)h+=`<div class="hour">${String(hr).padStart(2,'0')}:00</div>`+days.map(d=>`<div class="cell">${evs().filter(e=>e.date===fd(d)&&+e.time.slice(0,2)===hr).map(e=>`<div class="wevent" data-event="${e.id}">${e.time} ${e.title}</div>`).join('')}</div>`).join('');root.innerHTML=h+'</div>'}else{let d=cursor;$('#range').textContent=`${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;let h='<div class="dayview">';for(let hr=8;hr<=19;hr++)h+=`<div class="dayrow ${fd(d)===fd(today)?'is-today':''}"><div class="daytime ${fd(d)===fd(today)?'is-today':''}">${String(hr).padStart(2,'0')}:00</div><div class="slot">${evs().filter(e=>e.date===fd(d)&&+e.time.slice(0,2)===hr).map(e=>`<div class="devent ${e.color}">${e.time}–${e.end}　<b data-event="${e.id}">${e.title}</b></div>`).join('')}</div></div>`;root.innerHTML=h+'</div>'}$$('[data-event]').forEach(x=>x.onclick=()=>open('event',events.find(e=>e.id===x.dataset.event)))}
function taskrender(){let f=$('#filter').value,list=tasks.filter(t=>(f==='all'||t.priority===f)&&(tag==='全部'||t.tag===tag));$('#tasklist').innerHTML=list.map(t=>`<div class="task ${t.done?'done':''}"><input class="check" type="checkbox" ${t.done?'checked':''} data-check="${t.id}"><div class="taskbody"><div class="tasktitle">${t.title}</div><div class="meta"><span>截止 ${dl(t.due)}</span><span class="priority ${t.priority}">${{high:'高',medium:'中',low:'低'}[t.priority]}優先</span>${t.event?'↗ 行程':''}</div></div><button class="dots" data-edit="${t.id}">···</button></div>`).join('')||'<p style="color:#aaa;font-size:10px">目前沒有符合條件的任務</p>';let done=tasks.filter(t=>t.done).length;$('#taskfoot').textContent=`完成 ${done} / ${tasks.length} 項`;$('#navcount').textContent=tasks.filter(t=>!t.done).length;$('#tasksum').innerHTML=`${tasks.filter(t=>!t.done).length} <small>項待辦</small>`;$('#duesum').innerHTML=`${tasks.filter(t=>!t.done&&t.due<=fd(today)).length} <small>項任務</small>`;$('#eventsum').innerHTML=`${events.filter(e=>e.date===fd(today)).length} <small>場會議</small>`;$('#next').textContent=events.filter(e=>e.date===fd(today)).sort((a,b)=>a.time.localeCompare(b.time))[0]?.time||'—';$$('[data-check]').forEach(x=>x.onchange=()=>{let t=tasks.find(t=>t.id===x.dataset.check);t.done=x.checked;taskrender();toast(t.done?'任務已完成 ✓':'已恢復任務')});$$('[data-edit]').forEach(x=>x.onclick=()=>open('task',tasks.find(t=>t.id===x.dataset.edit)));links()}

function open(type,entry){$('#modaltitle').textContent=(entry?'編輯':'新增')+(type==='event'?'行程':'任務');let opts='<option>產品改版</option><option>例行工作</option>';if(type==='event')$('#fields').innerHTML=`<div class="field full"><label>行程名稱</label><input name="title" required value="${entry?.title||''}" placeholder="例如：產品週會"></div><div class="field"><label>日期</label><input name="date" type="date" required value="${entry?.date||fd(cursor)}"></div><div class="field"><label>分類</label><select name="tag">${opts}<option value="__new__">＋ 新增分類…</option></select><input name="newTag" placeholder="輸入新分類名稱" style="display:none;margin-top:5px"></div><div class="field"><label>開始時間</label><input name="time" type="time" required value="${entry?.time||'10:00'}"></div><div class="field"><label>結束時間</label><input name="end" type="time" required value="${entry?.end||'11:00'}"></div><div class="field full"><label>關聯任務（可複選）</label><select name="taskIds" multiple size="3" style="height:auto">${tasks.map(t=>`<option value="${t.id}" ${entry?.tasks.includes(t.id)?'selected':''}>${t.title}</option>`).join('')}</select></div>`;else $('#fields').innerHTML=`<div class="field full"><label>任務名稱</label><input name="title" required value="${entry?.title||''}" placeholder="例如：完成提案簡報初稿"></div><div class="field"><label>截止日期</label><input name="due" type="date" required value="${entry?.due||fd(cursor)}"></div><div class="field"><label>優先度</label><select name="priority"><option value="high">高優先</option><option value="medium">中優先</option><option value="low">低優先</option></select></div><div class="field"><label>分類</label><select name="tag">${opts}</select></div><div class="field"><label>關聯行程</label><select name="event"><option value="">不連結</option>${events.map(e=>`<option value="${e.id}">${e.date.slice(5)} ${e.time} ${e.title}</option>`).join('')}</select></div>`;const tagSelect=$('#fields [name=tag]');const newTagInput=$('#fields [name=newTag]');if(newTagInput){tagSelect.onchange=()=>{newTagInput.style.display=tag function close(){ $('#overlay').classList.remove('open') }function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2000)}
$('#entryform').onsubmit=e=>{e.preventDefault();let fdta=new FormData(e.currentTarget),type=e.currentTarget.dataset.type,id=e.currentTarget.dataset.id;if(type==='event'){if(fdta.get('tag')==='__new__'&&!fdta.get('newTag').trim()){toast('請輸入分類名稱');return}let item={id:id||`e${Date.now()}`,title:fdta.get('title'),date:fdta.get('date'),time:fdta.get('time'),end:fdta.get('end'),tag:(fdta.get('tag')==='__new__'?fdta.get('newTag').trim():fdta.get('tag')),color:['mint','yellow','coral','blue'][events.length%4],tasks:fdta.getAll('taskIds')};let i=events.findIndex(x=>x.id===id);i<0?events.push(item):events[i]=item}else{let item={id:id||`t${Date.now()}`,title:fdta.get('title'),due:fdta.get('due'),priority:fdta.get('priority'),tag:fdta.get('tag'),event:fdta.get('event'),done:tasks.find(t=>t.id===id)?.done||false};let i=tasks.findIndex(x=>x.id===id);i<0?tasks.push(item):tasks[i]=item;if(item.event){let ev=events.find(e=>e.id===item.event);if(ev&&!ev.tasks.includes(item.id))ev.tasks.push(item.id)}}close();refresh();toast(type==='event'?'行程已儲存':'任務已儲存')};function refresh(){calendar();taskrender()}function setview(v){view=v;$$('.views button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));calendar()}function shift(n){if(view==='month')cursor.setMonth(cursor.getMonth()+n);else cursor.setDate(cursor.getDate()+n*(view==='week'?7:1));calendar()}
$('#add').onclick=()=>open('event');$('#mobileadd').onclick=()=>open('event');$('#addtask').onclick=()=>open('task');$('#close').onclick=close;$('#cancel').onclick=close;$('#overlay').onclick=e=>{if(e.target.id==='overlay')close()};$('#filter').onchange=taskrender;$('#prev').onclick=()=>shift(-1);$('#nextperiod').onclick=()=>shift(1);$('#today').onclick=()=>{cursor=new Date(today);calendar()};$$('.views button').forEach(x=>x.onclick=()=>setview(x.dataset.view));$('#mprev').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);calendar()};$('#mnext').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);calendar()};$$('.tag').forEach(x=>x.onclick=()=>{tag=x.dataset.tag;$$('.tag').forEach(b=>b.classList.toggle('active',b===x));calendar();taskrender()});$$('[data-page]').forEach(x=>x.onclick=()=>{$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===x.dataset.page));$('#crumb').textContent={overview:'總覽',calendar:'行程日曆',tasks:'任務清單'}[x.dataset.page];const content=document.querySelector('.content');content.classList.remove('page-calendar','page-tasks');if(x.dataset.page==='calendar'){content.classList.add('page-calendar');setview('week')}if(x.dataset.page==='tasks'){content.classList.add('page-tasks');document.querySelector('.tasks').scrollIntoView({behavior:'smooth',block:'start'})}});$('#focus').onclick=()=>{document.querySelector('.tasks').scrollIntoView({behavior:'smooth',block:'center'});toast('今日有待辦事項，先從高優先任務開始')};$('#showlinks').onclick=()=>toast('行程與任務可在編輯視窗中互相連結');$('#search').onclick=()=>{let q=prompt('搜尋行程或任務');if(q){let n=[...events,...tasks].filter(x=>x.title.toLowerCase().includes(q.toLowerCase())).length;toast(n?`找到 ${n} 項相關內容`:'沒有找到相關內容')}};function renderSummary(){calendar();taskrender()}renderSummary()})();
